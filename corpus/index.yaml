# TaxPilot regulatory corpus catalogue
# Rule: no document may be cited unless it is registered here.

documents:
  - id: eu-2021-2101-en
    title: "Directive (EU) 2021/2101 of the European Parliament and of the Council of 24 November 2021 (public CbCR) — English"
    description: >
      Amends Directive 2013/34/EU by inserting Chapter 10a (Arts. 48a to 48h): obligation to
      publish the report on income tax information for groups and undertakings with consolidated
      revenue > EUR 750 million.
    file: eu/2021-2101_directive_public_cbcr_EN.pdf
    jurisdiction: EU
    language: en
    rank: directive
    publication_date: 2021-12-01          # OJ L 429/1
    entry_into_force: 2021-12-21           # 20 days after publication (Art. 3)
    transposition_deadline: 2023-06-22     # Art. 2
    first_financial_year: "first financial year starting on or after 2024-06-22 (Art. 48g)"
    official_source: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32021L2101"
    verified: true
    added_on: 2026-07-30

  - id: eu-2021-2101-es
    title: "Directiva (UE) 2021/2101 — Spanish official version (equally authentic)"
    description: >
      Same instrument as eu-2021-2101-en, Spanish language version from EUR-Lex. Article
      numbering in Spanish uses 48 bis/ter/quater/quinquies/sexies/septies/octies/nonies,
      mapping one-to-one to 48a-48h in the English version.
    file: eu/2021-2101_directive_public_cbcr_ES.pdf
    jurisdiction: EU
    language: es
    rank: directive
    official_source: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32021L2101"
    verified: true
    added_on: 2026-07-30

  - id: es-ley-22-2015-da11
    title: "Ley 22/2015, de 20 de julio, de Auditoría de Cuentas — consolidated text (BOE). Spanish public CbCR transposition: eleventh additional provision (DA 11ª)"
    description: >
      The DA 11ª (pp. 80-85 of the consolidated PDF) governs the obligation to report on
      corporate income tax (or taxes of identical or analogous nature) by certain undertakings
      and branches. Inserted by Ley 28/2022 of 21 December (the "startups law"), transposing
      Directive (EU) 2021/2101. Structure: Primero (scope), Segundo (content), Tercero
      (publication and accessibility), Cuarto (responsibility), Quinto (first financial year).
      Only official in Spanish.
    file: es/ley-22-2015_auditoria_consolidada_ES.pdf
    jurisdiction: ES
    language: es
    rank: law
    inserted_by: "Ley 28/2022, de 21 de diciembre (BOE-A-2022-21739)"
    first_financial_year: "financial years starting on or after 2024-06-22 (DA 11ª, ap. quinto)"
    specifics_vs_directive:
      - "Approval and publication deadline: 6 MONTHS from financial year end (DA 11ª, ap. tercero.1) — stricter than the 12 months of Art. 48d of the Directive"
      - "Mandatory filing with the Registro Mercantil together with the annual accounts (DA 11ª, ap. tercero.1)"
      - "Subsidiaries in scope: those NOT qualifying as a small entity under the thresholds of Art. 3 of Ley 22/2015 (DA 11ª, ap. primero.4)"
      - "Threshold: consolidated net turnover (INCN) > EUR 750 million in each of the last two consecutive financial years"
      - "Information may be reported following the modelo 231 instructions (Art. 14 RIS, RD 634/2015 and Orden HFP/1978/2016) (DA 11ª, ap. segundo.3)"
      - "Ultimate parent concept anchored to Art. 42 of the Código de Comercio"
    official_source: "https://www.boe.es/buscar/act.php?id=BOE-A-2015-8147"
    verified: true
    added_on: 2026-07-30

