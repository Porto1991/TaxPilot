# TaxPilot regulatory corpus catalogue
# Rule: no document may be cited unless it is registered here.

documents:
  - id: eu-2021-2101-en
    title: "Directive (EU) 2021/2101 of the European Parliament and of the Council of 24 November 2021 (public CbCR) — English"
    description: >
      Amends Directive 2013/34/EU by inserting Chapter 10a (Arts. 48a to 48h): obligation to
      publish the report on income tax information for groups and undertakings with consolidated
      revenue > EUR 750 million.
    file: eu/2021-2101_directive_public_cbcr_EN.pdf
    jurisdiction: EU
    language: en
    rank: directive
    publication_date: 2021-12-01          # OJ L 429/1
    entry_into_force: 2021-12-21           # 20 days after publication (Art. 3)
    transposition_deadline: 2023-06-22     # Art. 2
    first_financial_year: "first financial year starting on or after 2024-06-22 (Art. 48g)"
    official_source: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32021L2101"
    verified: true
    added_on: 2026-07-30

  - id: eu-2021-2101-es
    title: "Directiva (UE) 2021/2101 — Spanish official version (equally authentic)"
    description: >
      Same instrument as eu-2021-2101-en, Spanish language version from EUR-Lex. Article
      numbering in Spanish uses 48 bis/ter/quater/quinquies/sexies/septies/octies/nonies,
      mapping one-to-one to 48a-48h in the English version.
    file: eu/2021-2101_directive_public_cbcr_ES.pdf
    jurisdiction: EU
    language: es
    rank: directive
    official_source: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32021L2101"
    verified: true
    added_on: 2026-07-30

  - id: es-ley-22-2015-da11
    title: "Ley 22/2015, de 20 de julio, de Auditoría de Cuentas — consolidated text (BOE). Spanish public CbCR transposition: eleventh additional provision (DA 11ª)"
    description: >
      The DA 11ª (pp. 80-85 of the consolidated PDF) governs the obligation to report on
      corporate income tax (or taxes of identical or analogous nature) by certain undertakings
      and branches. Inserted by Ley 28/2022 of 21 December (the "startups law"), transposing
      Directive (EU) 2021/2101. Structure: Primero (scope), Segundo (content), Tercero
      (publication and accessibility), Cuarto (responsibility), Quinto (first financial year).
      Only official in Spanish.
    file: es/ley-22-2015_auditoria_consolidada_ES.pdf
    jurisdiction: ES
    language: es
    rank: law
    inserted_by: "Ley 28/2022, de 21 de diciembre (BOE-A-2022-21739)"
    first_financial_year: "financial years starting on or after 2024-06-22 (DA 11ª, ap. quinto)"
    specifics_vs_directive:
      - "Approval and publication deadline: 6 MONTHS from financial year end (DA 11ª, ap. tercero.1) — stricter than the 12 months of Art. 48d of the Directive"
      - "Mandatory filing with the Registro Mercantil together with the annual accounts (DA 11ª, ap. tercero.1)"
      - "Subsidiaries in scope: those NOT qualifying as a small entity under the thresholds of Art. 3 of Ley 22/2015 (DA 11ª, ap. primero.4)"
      - "Threshold: consolidated net turnover (INCN) > EUR 750 million in each of the last two consecutive financial years"
      - "Information may be reported following the modelo 231 instructions (Art. 14 RIS, RD 634/2015 and Orden HFP/1978/2016) (DA 11ª, ap. segundo.3)"
      - "Ultimate parent concept anchored to Art. 42 of the Código de Comercio"
    official_source: "https://www.boe.es/buscar/act.php?id=BOE-A-2015-8147"
    verified: true
    added_on: 2026-07-30

  - id: eu-list-non-cooperative
    title: "EU list of non-cooperative jurisdictions for tax purposes — official Commission overview (all revisions up to 17 Feb 2026)"
    description: >
      Official European Commission record of every revision of the EU list (Annexes I and II),
      most recent: adopted 17 Feb 2026, published in the OJ on 6 Mar 2026. Machine-readable
      snapshots extracted (and verified against this PDF) in eu_list_snapshots.yaml, used by
      scripts/analyze_cbcr_excel.py to apply the 1-March rule of Art. 48c(5).
    file: eu/eu-list-non-cooperative_2026-02_EN.pdf
    jurisdiction: EU
    language: en
    rank: council-conclusions-record
    official_source: "https://taxation-customs.ec.europa.eu/document/download/3ceac073-5184-46a0-864a-b3038e4d9a6b_en?filename=eu_list_update_17-02-2026.pdf"
    verified: true
    added_on: 2026-07-30

  - id: eu-2024-2952
    title: "Commission Implementing Regulation (EU) 2024/2952 of 29 November 2024 — common template and electronic reporting formats for public CbCR"
    description: >
      Lays down the mandatory common template and machine-readable electronic (XBRL) reporting
      formats required by Art. 48c(4) of Directive 2013/34/EU. Undertakings must apply it to
      reports on income tax information for financial years starting on or after 1 January 2025
      (Art. 5, transitional provisions). The Commission published the reporting package
      (taxonomy) on 22 December 2025.
    file: eu/2024-2952_implementing_regulation_template_EN.pdf
    jurisdiction: EU
    language: en
    rank: implementing-regulation
    first_financial_year: "financial years starting on or after 2025-01-01 (Art. 5)"
    official_source: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R2952"
    verified: true
    added_on: 2026-07-30

  - id: es-boicac-144-c5
    title: "ICAC — BOICAC No. 144/2025, query 5: publication obligation under DA 11ª when the ultimate parent is resident in another Member State"
    description: >
      Official ICAC criterion (published 19 Jan 2026): where the ultimate parent is resident in
      another Member State (Italy in the query), the obligation to draw up, approve and publish
      the public CbCR report is governed by THAT Member State's law and deadlines — the Spanish
      6-month deadline of DA 11ª ap. tercero does not bind the Spanish subsidiary, which may
      file its annual accounts with the Registro Mercantil without waiting for the parent's
      publication.
    file: es/boicac144_consulta5_icac_ES.pdf
    jurisdiction: ES
    language: es
    rank: administrative-criterion
    official_source: "https://www.icac.gob.es/sites/default/files/2026-01/Consulta%205%20rv.pdf"
    verified: true
    added_on: 2026-07-30

  - id: es-dgsjfp-2026
    title: "Resolución de 19 de mayo de 2026, DGSJFP — modelos de presentación en el Registro Mercantil de las cuentas anuales consolidadas (BOE-A-2026-11582)"
    description: >
      Includes the standardised model «IP» (información relativa al impuesto de sociedades —
      presentación de información por países) for filing the DA 11ª public CbCR report with the
      Registro Mercantil, plus a checkbox in the filing request form. References the EU public
      CbCR XBRL taxonomy published by the Commission on 22 December 2025 (Annexes II-III).
    file: es/dgsjfp-2026-05-19_modelos_cuentas_consolidadas_RM_ES.pdf
    jurisdiction: ES
    language: es
    rank: resolution
    official_source: "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-11582"
    verified: true
    added_on: 2026-07-30

