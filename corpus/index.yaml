# Catálogo del corpus normativo de TaxPilot
# Regla: ningún documento se cita si no está registrado aquí.

documentos:
  - id: ue-2021-2101
    titulo: "Directiva (UE) 2021/2101 del Parlamento Europeo y del Consejo, de 24 de noviembre de 2021 (public CbCR)"
    descripcion: >
      Modifica la Directiva 2013/34/UE introduciendo el Capítulo 10 bis (arts. 48 bis a 48 nonies):
      obligación de publicar el informe relativo al impuesto sobre sociedades para grupos y empresas
      con ingresos consolidados > 750 M EUR.
    fichero: ue/2021-2101_directiva_public_cbcr_ES.pdf
    jurisdiccion: UE
    idioma: es
    rango: directiva
    fecha_publicacion: 2021-12-01        # DOUE L 429/1
    entrada_en_vigor: 2021-12-21          # 20 días tras publicación (art. 3)
    plazo_transposicion: 2023-06-22       # art. 2
    primer_ejercicio_aplicable: "primer ejercicio iniciado a partir del 2024-06-22 (art. 48 octies)"
    fuente_oficial: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32021L2101"
    verificado: true
    fecha_incorporacion: 2026-07-30

  - id: es-ley-22-2015-da11
    titulo: "Ley 22/2015, de 20 de julio, de Auditoría de Cuentas — texto consolidado (BOE). Transposición española del public CbCR: disposición adicional undécima"
    descripcion: >
      La DA 11ª (págs. 80-85 del PDF consolidado) regula la obligación de informar acerca del
      impuesto sobre sociedades o impuestos de naturaleza idéntica o análoga por parte de
      determinadas empresas y sucursales. Introducida por la Ley 28/2022, de 21 de diciembre,
      de fomento del ecosistema de las empresas emergentes ("ley de startups"), que transpone
      la Directiva (UE) 2021/2101. Estructura: Primero (obligados), Segundo (contenido),
      Tercero (publicación y accesibilidad), Cuarto (responsabilidad), Quinto (primer ejercicio).
    fichero: es/ley-22-2015_auditoria_consolidada_ES.pdf
    jurisdiccion: ES
    idioma: es
    rango: ley
    norma_de_introduccion: "Ley 28/2022, de 21 de diciembre (BOE-A-2022-21739)"
    primer_ejercicio_aplicable: "ejercicios económicos iniciados a partir del 2024-06-22 (DA 11ª, apartado quinto)"
    particularidades_vs_directiva:
      - "Plazo de aprobación y publicación: 6 MESES desde el cierre del ejercicio (DA 11ª, ap. tercero.1) — más estricto que los 12 meses del art. 48 quinquies de la Directiva"
      - "Depósito obligatorio en el Registro Mercantil junto con las cuentas anuales (DA 11ª, ap. tercero.1)"
      - "Filiales obligadas: las que NO tengan consideración de entidad pequeña según umbrales del art. 3 de la Ley 22/2015 (DA 11ª, ap. primero.4)"
      - "Umbral: importe neto de la cifra anual de negocios (INCN) consolidada > 750 M EUR en cada uno de los dos últimos ejercicios consecutivos"
      - "La información puede comunicarse según las instrucciones del modelo 231 (art. 14 RIS, RD 634/2015 y Orden HFP/1978/2016) (DA 11ª, ap. segundo.3)"
      - "Concepto de dominante última anclado al art. 42 del Código de Comercio"
    fuente_oficial: "https://www.boe.es/buscar/act.php?id=BOE-A-2015-8147"
    verificado: true
    fecha_incorporacion: 2026-07-30

