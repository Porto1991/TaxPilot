# EU list of non-cooperative jurisdictions for tax purposes — machine-readable snapshots.
# Verified against the official European Commission overview PDF in this folder
# (eu-list-non-cooperative_2026-02_EN.pdf), which records every revision.
#
# Relevance for public CbCR [Directive (EU) 2021/2101, Art. 48c(5)]:
#   - Annex I: report separately each jurisdiction listed on 1 March of the financial year
#     FOR WHICH the report is drawn up.
#   - Annex II: report separately each jurisdiction listed on 1 March of that financial year
#     AND on 1 March of the preceding financial year (two-year rule).
#   - Safeguard clause omissions are NEVER allowed for Annex I/II jurisdictions [Art. 48c(6)].
#
# NOTE (flagged ambiguity): updates are adopted by the Council in February and October and
# published in the OJ some days later (e.g. the 17 Feb 2026 revision was published on
# 6 March 2026). For a 1-March test falling between adoption and OJ publication, both
# readings should be presented to the client.

